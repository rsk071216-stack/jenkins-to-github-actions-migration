# Keeps every pinned dependency current. Actions are pinned by commit SHA;
# Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
