# Reusable workflow: secure container build for any repository in the organisation.
#
# Replaces the legacy shared library step `dockerBuildPush` plus the Trivy and
# push stages of the Jenkinsfile. One versioned file instead of 140 copies.
#
#   build -> SBOM (Syft) -> vulnerability gate (Trivy) -> push (GHCR, GITHUB_TOKEN)
#         -> keyless signature (cosign) -> SBOM attestation (cosign) -> SLSA provenance
#
# Caller example (from another repository, pinned to a tag or commit SHA):
#
#   jobs:
#     image:
#       permissions:
#         contents: read
#         packages: write        # only when push: true
#         id-token: write        # only when push: true (keyless signing, provenance)
#         attestations: write    # only when push: true
#         security-events: write # only when push: true (SARIF upload)
#       uses: rsk071216-stack/jenkins-to-github-actions-migration/.github/workflows/reusable-container-build.yml@v1.0.0
#       with:
#         image-name: my-org/my-service
#         context: .
#         push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
#
# Permissions are deliberately NOT declared here: a called workflow inherits the
# caller's job permissions, so pull-request callers can run it read-only.
name: reusable-container-build

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository path under ghcr.io, lowercase (e.g. "owner/service").
        type: string
        required: true
      context:
        description: Docker build context.
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root. Defaults to <context>/Dockerfile.
        type: string
        default: ""
      build-args:
        description: Newline-separated build arguments.
        type: string
        default: ""
      push:
        description: Push, sign and attest the image. Only set true on trusted refs.
        type: boolean
        default: false
      severity:
        description: Trivy severities that fail the build.
        type: string
        default: CRITICAL,HIGH
      cache-scope:
        description: GitHub Actions cache scope for Buildx layers.
        type: string
        default: container-build
    outputs:
      image:
        description: Fully qualified image name without tag.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image manifest digest (sha256:...). Empty when push is false.
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: build, scan${{ inputs.push && ', push, sign, attest' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve names
        id: vars
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "scan-ref=local.scan/${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE:-${CONTEXT}/Dockerfile}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once and load into the local daemon so the exact bytes can be
      # scanned BEFORE anything leaves the runner.
      - name: Build (load for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.vars.outputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.vars.outputs.scan-ref }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max

      - name: Generate SBOM (SPDX, Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.vars.outputs.scan-ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

      - name: Vulnerability gate (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.scan-ref }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          scanners: vuln
          format: table
          exit-code: "1"

      - name: Trivy SARIF report
        if: inputs.push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.scan-ref }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SARIF to code scanning
        if: inputs.push
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Log in to GHCR with the job-scoped GITHUB_TOKEN
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs + warm cache => the pushed image has the same layers and
      # config as the one that was scanned above.
      - name: Push
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.vars.outputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.cache-scope }}

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless signature + SBOM attestation (Sigstore)
        if: inputs.push
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # No keys to store or rotate: cosign exchanges the job's OIDC token for a
          # short-lived Fulcio certificate bound to this workflow identity, and the
          # signature is recorded in the Rekor transparency log.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance attestation
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need the org-only "artifact-metadata" permission.
          create-storage-record: false

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Container build"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Pushed | ${PUSHED} |"
            echo "| Digest | \`${DIGEST:-n/a (not pushed)}\` |"
            echo "| SBOM | \`sbom.spdx.json\` artifact (SPDX 2.3)$([ "$PUSHED" = "true" ] && echo ', attested with cosign') |"
            echo "| Signature | $([ "$PUSHED" = "true" ] && echo 'cosign keyless (Sigstore Fulcio + Rekor)' || echo 'skipped (not a main push)') |"
            echo "| Provenance | $([ "$PUSHED" = "true" ] && echo 'SLSA v1 via actions/attest-build-provenance' || echo 'skipped (not a main push)') |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUSHED" = "true" ] && [ -n "$DIGEST" ]; then
            {
              echo
              echo "Verify:"
              echo '```bash'
              echo "cosign verify ${IMAGE}@${DIGEST} \\"
              echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/' \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
